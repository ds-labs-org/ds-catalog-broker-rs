[workspace]
resolver = "2"
members = [
    "crates/catalog-core",
    "crates/rdf-store",
    "crates/ds-catalog-broker-rs",
    "crates/dcp-core",
    "crates/crawler",
    # Vendored as git submodules (see vendor/README.md) - contreforts-kg is
    # the real Oxigraph-backed store this project's rdf-store crate builds
    # on; contreforts-core and contreforts-config are its own hard
    # dependencies, pulled in as first-class workspace members (not a
    # separate nested workspace) so this root Cargo.toml's
    # [workspace.dependencies] - not contreforts-workspace's own - decides
    # shared versions and feature defaults, including oxigraph's
    # `default-features = false` below.
    "vendor/contreforts-kg",
    "vendor/contreforts-core",
    "vendor/contreforts-core/declaration",
    "vendor/contreforts-config",
]

[workspace.package]
version = "0.1.0"
# 2024, not this project's original 2021: contreforts-core/contreforts-kg/
# contreforts-config all inherit `edition.workspace = true` from here, and
# their authors wrote them against 2024 - lowering it back to 2021 for them
# would be the actual behavior change, not raising ours.
edition = "2024"
# MIT, not this project's own license: only the vendored contreforts-config
# inherits `license.workspace = true` from here, and MIT is its real
# upstream license. This project's own crates (crates/*) declare
# `license = "GPL-3.0-or-later"` directly rather than inheriting, so that
# relicensing them doesn't also mislabel someone else's vendored crate.
license = "MIT"
# contreforts-core/contreforts-config inherit `authors.workspace = true`;
# matches the author string their own (unvendored) Cargo.toml used.
authors = ["Deepthought Solutions"]
repository = "https://github.com/Deepthought-Solutions/ds-catalog-broker-rs"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# CancellationToken: one shutdown signal shared by the HTTP server and the
# crawl scheduler. Already in the graph through hyper/h2.
tokio-util = "0.7"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
# Used by crawler's crawl_once to crawl participants concurrently with a
# bound (`StreamExt::buffered`). Already in the graph through reqwest/axum.
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Below: added only because vendored contreforts-* members inherit these via
# `{ workspace = true }` - not otherwise needed by this project's own crates.
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# Used by ds-catalog-broker-rs to mint @id values (urn:uuid:...) for synthesized DSP
# JSON-LD documents (Catalog, Offer, CatalogError) that have no natural
# stable identifier of their own.
uuid = { version = "1", features = ["v4"] }
# Used by ds-catalog-broker-rs's DspAuthMode::Dcp (see compliance/dcp-test-env/) for
# did:web resolution and calling a holder's DCP Presentation API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# ES256 sign/verify for DCP self-issued tokens and the outgoing
# re-packaged token - used directly (JWS compact serialization built and
# parsed by hand in ds-catalog-broker-rs) rather than through a JWT-framework crate,
# since the only two operations needed are "sign this JSON with my key"
# and "verify this JWS against a JWK's raw x/y", and jsonwebtoken's JWK
# support added more format-conversion friction than it saved.
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand = "0.8"
base64 = "0.22"
# A real, spec-tested JWT library for the OAuth2 Bearer resource-server
# check (docs/oauth2-bearer-gating-2026-08-28.md), gating GET /catalog and
# GET/POST /sparql. Deliberately not the same choice as p256/rand above:
# those hand-roll a single, self-issued ES256 token type this project
# fully controls the shape of (dcp-core); here the token comes from an
# arbitrary external authorization server whose signing algorithm and
# claim shape aren't controlled by this project, which is exactly the case
# a maintained JWT library is for - see ds-catalog-broker-rs's oauth2.rs
# module doc.
jsonwebtoken = "9"
# default-features = false is load-bearing: contreforts-config's own
# manifest does `oxigraph = { workspace = true }` unmodified (it has no
# feature-switch of its own, unlike contreforts-kg after
# contreforts/contreforts-kg#58), so *this* is the only place in the whole
# graph that can turn RocksDB off for it. contreforts-kg's own
# `default = ["rocksdb"]` feature (see vendor/contreforts-kg/Cargo.toml)
# still re-enables `oxigraph/rocksdb` unless rdf-store's own dependency on
# contreforts-kg is built with `--no-default-features` - see rdf-store's
# Cargo.toml for which one this project actually uses.
oxigraph = { version = "0.5.11", default-features = false }
# The SPARQL evaluator oxigraph uses (0.5.11 pins `spareval = "=0.2.7"`).
# Used only for its `QueryableDataset` trait, so rdf-store can evaluate a
# per-caller ODRL-filtered view of the store through oxigraph's own
# `on_queryable_dataset` without copying it. Cargo resolves this to the
# same copy oxigraph pins; a mismatch would be a compile error, not a
# silent second copy.
spareval = { version = "0.2.7", default-features = false }
contreforts-core = { path = "vendor/contreforts-core" }
contreforts-config = { path = "vendor/contreforts-config" }
