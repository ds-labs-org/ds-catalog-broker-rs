[package]
name = "ds-catalog-broker-rs"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
description = "Axum HTTP server for the DSP Catalog Broker: harvests 1..N upstream DSP Catalog Services into a unified semantic (RDF) cache and serves it locally as a dataset-list-per-participant view and a SPARQL endpoint - it does not itself answer incoming DSP CatalogRequestMessages."

[[bin]]
name = "ds-catalog-broker-rs"
path = "src/main.rs"

[dependencies]
catalog-core = { path = "../catalog-core" }
rdf-store = { path = "../rdf-store" }
dcp-core = { path = "../dcp-core" }
crawler = { path = "../crawler" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
# JWT verification for the OAuth2 Bearer gate - see src/oauth2.rs's module
# doc and docs/oauth2-bearer-gating-2026-08-28.md.
jsonwebtoken = { workspace = true }
# ODRL policy evaluation for gap analysis §3.4's dataset-visibility
# filtering - see src/odrl_filter.rs's module doc. A git dependency on
# the `engine` crate of ds-labs-org/ds-odrl-engine-rs, pinned by `rev`
# (Cargo.lock is not committed), so a standalone clone of this repo and CI
# can build it, and so CI's clippy/fmt gates don't lint another repo's
# code. Deliberately *not* its `dsp-odrl-adapter` (that crate ingests raw
# ODRL JSON-LD from a wire document, a concern this crate doesn't have:
# `catalog_core::Policy` is already a real, structured, first-class type
# by the time it reaches this bridge - the mapping this module needs is
# catalog-core's own struct shape to `engine`'s wire types, not JSON-LD
# ingestion).
engine = { git = "https://github.com/ds-labs-org/ds-odrl-engine-rs", rev = "9abe91b968ac31a9b399fb3e68416e72ea7a1cfd" }
# `with_context_claims` (src/odrl_filter.rs) sets a `dateTime` context claim
# from the current wall-clock time, mirroring `ds-sql-dps-rs`'s own
# `dataplane/src/public.rs::get_file` pattern exactly.
chrono = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
urlencoding = { workspace = true }
# Mint EC keypairs and hand-sign compact JWS test tokens for a mock JWKS
# endpoint in oauth2.rs's and lib.rs's own tests - independent of both
# jsonwebtoken's own EncodingKey and of dcp-core's sign_jws, so the
# production verifier this exercises is proven against a signer with no
# shared code path. See oauth2.rs's `test_support` module.
p256 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
# The real, already-published client this product's `POST
# /api/management/v4/catalogs/request` route must be wire-compatible with -
# used only in tests, to deserialize this route's real response body into
# the client's own `FederatedCatalogOffer`/`Dataset`/`Service`/`ParticipantId`
# structs (see lib.rs's tests). Production code does not depend on this
# crate: the route builds its own request/response types by hand so the
# wire format is this product's own responsibility, proven correct against
# the real client rather than borrowed from it.
edc-federated-catalog-client = "0.2.5"
# The same real ODRL `Policy`/`Permission`/`Prohibition`/`Constraint` types
# `edc-federated-catalog-client`'s own `Dataset::has_policy` deserializes
# into (see that crate's own Cargo.toml for this exact `package =` rename
# pattern) - used only in lib.rs's wire-compat test, to assert on the real
# deserialized policy content field-by-field, not just that the array is
# non-empty. Pinned to the version this workspace's Cargo.lock already
# resolves `edc-federated-catalog-client` 0.2.5's own dependency to, so
# there is exactly one copy of these types in the dependency graph.
edc-connector-client = { version = "0.6.8", package = "edc-connector-client-next" }
